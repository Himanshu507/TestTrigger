[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-trigger"
version = "0.1.0"
description = "AI-assisted test orchestration platform"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=1.5.9",
  "openai>=3.1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# The domain owns names like TestCase, TestIntent, and TestCatalog. Tests are
# plain functions, so class collection is disabled rather than renaming them.
python_classes = []

[tool.setuptools.packages.find]
include = ["app*"]
